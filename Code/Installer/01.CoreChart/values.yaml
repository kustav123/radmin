# Subchart configurations
# Configure installation, image, and node selector for each service

cloudnative-pg:
  enabled: true
  # -- Specifies whether the CRDs should be created when installing the chart.
  crds:
    create: true
  image:
    repository: ghcr.io/cloudnative-pg/cloudnative-pg
    tag: 1.28.1
  nodeSelector: {}
  # Example:
  # nodeSelector:
  #   role: database
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

strimzi-kafka-operator:
  enabled: false
  image:
    registry: quay.io
    repository: strimzi
    name: operator
    tag: 0.51.0
  nodeSelector: {}
  # Example:
  # nodeSelector:
  #   role: kafka-operator
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault


# Readiness check job configuration
waitJob:
  image:
    repository: bitnami/kubectl
    tag: latest

openebs:
  enabled: true
  localpv-provisioner:
    enabled: true
    # Hostpath settings matching our Talos setup
    hostpath:
      basePath: /var/openebs

  # Disabling NDM - no longer using raw block devices
  ndm:
    enabled: false
  
  ndmOperator:
    enabled: false

  # Disable the Local Device provisioner
  localpv-device:
    enabled: false

argo-cd:
  enabled: true
  # Deploying to 'argocd' namespace as requested
  namespaceOverride: "argocd"
  server:
    service:
      type: NodePort
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  controller:
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  repoServer:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  redis:
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 50m
        memory: 32Mi
  dex:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  configs:
    params:
      server.insecure: true

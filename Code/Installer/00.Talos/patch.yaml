machine:
  network:
    interfaces:
      - interface: eth1
        addresses:
          - 192.168.56.105/24

  kubelet:
    extraArgs:
      node-ip: 192.168.56.105
    extraMounts:
      - destination: /var/openebs
        type: bind
        source: /var/openebs
        options:
          - bind
          - rshared
          - rw

cluster:
  allowSchedulingOnControlPlanes: true
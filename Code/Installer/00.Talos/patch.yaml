machine:
  network:
    interfaces:
      - interface: eth1
        addresses:
          - 192.168.56.104/24
  kernel:
    modules:
      - name: nvme_tcp
      - name: nvme_core
      - name: nvme_fabrics
  kubelet:
    extraArgs:
      node-ip: 192.168.56.104
    extraMounts:
      - destination: /var/openebs
        type: bind
        source: /var/openebs
        options:
          - bind
          - rshared
          - rw
  sysctls:
    vm.nr_hugepages: "1024"
cluster:
  allowSchedulingOnControlPlanes: true
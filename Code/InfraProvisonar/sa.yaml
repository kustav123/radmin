apiVersion: v1
kind: ServiceAccount
metadata:
  name: infra-provisioner-sa
  namespace: app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infra-provisioner-role
rules:
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["clusters"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services", "secrets", "namespaces"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infra-provisioner-binding
subjects:
- kind: ServiceAccount
  name: infra-provisioner-sa
  namespace: app
roleRef:
  kind: ClusterRole
  name: infra-provisioner-role
  apiGroup: rbac.authorization.k8s.io
